<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Omkar Dhamdhere Portfolio</title>
    <script type="text/javascript">
      // Single Page Application redirect for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Copyright (c) 2016 Rafael Pedicini, licensed under the MIT License
      // https://github.com/rafgraph/spa-github-pages/blob/master/LICENSE
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the user to the
      // index.html page with that query string.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
